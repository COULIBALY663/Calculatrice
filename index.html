<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Calculatrice Scientifique</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#1e1e1e">
</head>
<body class="bg-dark overflow-hidden">

<div class="container-fluid min-vh-100 d-flex align-items-center">
  <div class="row w-100 justify-content-center">

    <!-- CALCULATRICE -->
    <div class="col-12 col-md-6 col-lg-4 mb-3">
      <div class="calculator bg-secondary p-3 rounded h-100">

        <!-- ÉCRAN -->
        <div id="screen" class="screen mb-2">0</div>

        <!-- MODE + HISTORIQUE -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <button id="btnMode" class="btn btn-outline-success" onclick="toggleMode()">DEG</button>
          <button id="toggleHistory" class="btn btn-dark d-md-none mb-2"> 📜 Afficher l’historique</button>

          <span class="text-white small">Scientifique</span>
        </div>

        <!-- BOUTONS -->
        <div class="buttons d-grid gap-2">
          <button onclick="clearAll()">AC</button>
          <button onclick="clearLast()">C</button>
          <button onclick="append('(')">(</button>
          <button onclick="append(')')">)</button>

          <button onclick="insertSqrt()">√</button>
          <button onclick="sin()">sin</button>
          <button onclick="cos()">cos</button>
          <button onclick="tan()">tan</button>

          <button onclick="log()">log</button>
          <button onclick="ln()">ln</button>
          <button onclick="appendExponent()">^</button>
          <button onclick="append('/')">÷</button>

          <button onclick="append('7')">7</button>
          <button onclick="append('8')">8</button>
          <button onclick="append('9')">9</button>
          <button onclick="append('*')">×</button>

          <button onclick="append('4')">4</button>
          <button onclick="append('5')">5</button>
          <button onclick="append('6')">6</button>
          <button onclick="append('-')">−</button>

          <button onclick="append('1')">1</button>
          <button onclick="append('2')">2</button>
          <button onclick="append('3')">3</button>
          <button onclick="append('+')">+</button>

          <button onclick="append('0')">0</button>
          <button onclick="append('.')">.</button>
          <button onclick="insertPi()">π</button>
          <button onclick="calculate()">=</button>
        </div>

      </div>
    </div>

    <!-- HISTORIQUE -->
    <div class="col-12 col-md-4 col-lg-3">
      <div class="history-panel bg-light text-dark p-3 rounded h-100">
        <h5 class="text-center">Historique</h5>
        <ul id="historyList" class="list-unstyled mb-0"></ul>
      </div>
    </div>

  </div>
</div>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
